global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http

    log global

    option httplog
    option dontlognull

    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend todolist_http
    bind :80

    default_backend iam_api

backend iam_api
    option httpchk GET /health

    http-check expect status 200

    server iam-1 iam.lan:8000 check
